.wf i{flex:1;background:var(--ink);border-radius:3px;min-height:3px}

.rbtn{width:76px;height:76px;border-radius:50%;padding:0;margin:8px auto 2px;display:flex;align-items:center;justify-content:center;background:var(--p)}

.lbl{text-align:center;font-weight:800;font-size:.85rem}

.top .card{margin:0}
.wc{text-align:center;transition:background .15s}
.wd{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;letter-spacing:-.02em;margin:6px 0 12px;overflow-wrap:anywhere}

.rc.yes{background:#c8f7e3}.rc.no{background:#ffd9e5}
.ri{flex:1;min-width:0;line-height:1.25}.ri small{display:block;color:var(--mut);font-style:italic;overflow-wrap:anywhere}
.rs2{text-align:right;font-size:.8rem;line-height:1.25}.rs2 em{display:block;font-style:normal;font-weight:900}.rs2 b{display:block}
.act{background:var(--y)!important}.rc.act{transform:scale(1.03)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
button.ch{padding:4px 12px;margin:0;font-size:.85rem;box-shadow:none;background:#fff;border-width:2px;border-radius:999px}
button.ch.on{background:var(--ink);color:#fff}
.winner{font-size:1.6rem;font-weight:900}
#msg{color:#c0245a;min-height:1.4em;font-weight:800}
@media (max-width:860px){.hm,.gm{grid-template-columns:1fr}.entry{order:-1;position:static}.pn{position:static}}

<body>
<main>
<h1 class="logo" id="logo">netsret<i aria-hidden="true">netsret</i></h1>
<p class="sub">Tersten duy, taklit et, kelimeyi bul.</p>
<div id="msg" role="alert"></div>
<div id="app"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>
var ctx=null,peer=null,isHost=false,conns={},hostConn=null,me="",code="",name="",cur=null,SR=null;
var S={players:[],order:[],idx:0,phase:"lobby",word:"",raw:null,got:{},st:{}};
var V={},myRaw=null,myBuf=null,micId="";
try{micId=localStorage.getItem("netsretMic")||""}catch(e){}
function $(i){return document.getElementById(i)}
function msg(t){$("msg").textContent=t||""}
function ui(h){$("app").innerHTML=h}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(t){return String(t).trim().toLocaleLowerCase("tr")}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* ---------- ses ---------- */
function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}
function trim(b){
  var d=b.getChannelData(0),pk=0,i;
  for(i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]));
  var th=Math.max(0.006,pk*0.03),s=0,e=d.length-1;
  while(s<e&&Math.abs(d[s])<th)s++;
  while(e>s&&Math.abs(d[e])<th)e--;
  var pad=Math.floor(b.sampleRate*0.08);
  s=Math.max(0,s-pad);e=Math.min(d.length-1,e+pad);
  var g=pk>0.01?Math.min(8,0.9/pk):1,o=ac().createBuffer(b.numberOfChannels,e-s+1,b.sampleRate);
  for(var c=0;c<b.numberOfChannels;c++){
    var src=b.getChannelData(c),dst=o.getChannelData(c);
    for(i=0;i<dst.length;i++)dst[i]=src[s+i]*g;
  }
  return o;
}
function rev(b){
  var o=ac().createBuffer(b.numberOfChannels,b.length,b.sampleRate);
  for(var c=0;c<b.numberOfChannels;c++){var s=b.getChannelData(c),d=o.getChannelData(c),n=s.length;for(var i=0;i<n;i++)d[i]=s[n-1-i]}
  return o;
}
function stopAll(){if(cur){try{cur.stop()}catch(e){}cur=null}}
function play(b,done){
  stopAll();
  var c=ac(),s=c.createBufferSource(),g=c.createGain(),t=c.currentTime+.03,f=.02;
  s.buffer=b;s.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+f);
  g.gain.setValueAtTime(1,Math.max(t+f,t+b.duration-f));g.gain.linearRampToValueAtTime(0,t+b.duration);
  s.onended=function(){if(cur===s)cur=null;if(done)done()};
  cur=s;s.start(t);
}
function toAB(raw){var u=new Uint8Array(raw);return u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength)}
function load(raw){return ac().decodeAudioData(toAB(raw)).then(trim)}
function mic(){
  var c={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
  if(micId)c.deviceId={exact:micId};
  return navigator.mediaDevices.getUserMedia({audio:c}).catch(function(e){
    if(micId){micId="";return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
    throw e;
  });
}
function fmt(ms){var t=Math.floor(ms/100)/10,m=Math.floor(t/60),s=(t-m*60).toFixed(1);return(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
function eqpg(){return '<div class="eq">'+new Array(25).join('<i></i>')+'</div><div class="pg"><b></b></div>'}
function tick(box,ms,l,max){
  var a=box.querySelector(".tm"),p=box.querySelector(".pg b"),e=box.querySelectorAll(".eq i");
  if(a)a.textContent=fmt(ms);
  if(p)p.style.width=Math.min(100,ms/(max*10))+"%";
  var h=box._h||(box._h=[]);h.push(l);if(h.length>e.length)h.shift();
  var off=e.length-h.length;
  e.forEach(function(x,i){x.style.height=Math.max(8,(h[i-off]||0)*10)+"%"});
}
function bars(buf,n){
  var d=buf.getChannelData(0),step=Math.floor(d.length/n)||1,o=[],mx=0.001;
  for(var i=0;i<n;i++){var s=0;for(var j=0;j<step;j++)s=Math.max(s,Math.abs(d[i*step+j]||0));o.push(s);mx=Math.max(mx,s)}
  return o.map(function(v){return Math.max(.08,v/mx)});
}
function wfHtml(buf){return bars(buf,48).map(function(v){return '<i style="height:'+Math.round(v*100)+'%"></i>'}).join("")}
function capture(o){
  var c={},mr,stream,an,src,raf,t0,chunks=[];
  c.start=async function(){
    try{ac();stream=await mic()}
    catch(e){msg("Mikrofon izni alınamadı. Tarayıcı ayarlarından izin ver.");o.onFail();return}
    chunks=[];
    an=ac().createAnalyser();an.fftSize=512;src=ac().createMediaStreamSource(stream);src.connect(an);
    var d=new Uint8Array(an.fftSize);
    try{mr=new MediaRecorder(stream,{audioBitsPerSecond:64000})}catch(e){mr=new MediaRecorder(stream)}
    mr.ondataavailable=function(e){chunks.push(e.data)};
    mr.onstop=async function(){
      cancelAnimationFrame(raf);stream.getTracks().forEach(function(t){t.stop()});src.disconnect();
      if(!o.alive())return;
      try{
        var raw=await new Blob(chunks).arrayBuffer();
        var b=trim(await ac().decodeAudioData(raw.slice(0)));
        if(b.duration<0.25){msg("Ses çok kısa, tekrar dene.");o.onFail();return}
        msg();o.onDone(raw,b);
      }catch(e){msg("Ses çözülemedi, tekrar kaydet.");o.onFail()}
    };
    mr.start();t0=performance.now();msg();o.onStart();
    (function loop(){
      if(!o.alive()){c.stop();return}
      an.getByteTimeDomainData(d);var p=0;
      for(var i=0;i<d.length;i++)p=Math.max(p,Math.abs(d[i]-128));
      var ms=performance.now()-t0;o.onTick(ms,Math.min(10,Math.round(p/128*20)));
      if(ms>=o.max*1000){c.stop();return}
      raf=requestAnimationFrame(loop);
    })();
  };
  c.stop=function(){if(mr&&mr.state==="recording")mr.stop()};
  return c;
}
function recUI(box,o){
  var max=o.max||8,cap,raw,buf;
  function alive(){return box.isConnected}
  function ev(s){if(o.onState)o.onState(s)}
  function ready(){box.innerHTML='<div class="rp"><div class="rh"><span class="pill">HAZIR</span><b class="tm">00:00.0</b></div><div class="rt">'+esc(o.title)+'</div><div class="rs">'+esc(o.hint)+' (en fazla '+max+' sn)</div>'+eqpg()+'</div><div class="rb"><button class="rbtn" data-r="s" aria-label="Kaydı başlat"><i></i></button><div class="lbl">Kaydet</div></div>'}
  function recording(){box.innerHTML='<div class="rp"><div class="rh"><span class="pill r">● KAYIT</span><b class="tm">00:00.0</b></div><div class="rt">Şimdi söyle!</div><div class="rs">'+esc(o.hint)+'</div>'+eqpg()+'</div><div class="rb"><button class="rbtn stop" data-r="e" aria-label="Kaydı bitir"><i></i></button><div class="lbl">Bitir</div></div>';ev("rec")}
  function preview(){
    box.innerHTML='<div class="rp"><div class="rh"><span class="pill a">ÖNİZLEME</span><b class="tm">'+fmt(buf.duration*1000)+'</b></div><div class="rt">Kaydın hazır</div><div class="rs">Dinle, beğenmezsen yeniden kaydet.</div><div class="wf">'+wfHtml(buf)+'</div>'+(o.note?'<div class="okb">'+esc(o.note)+'</div>':'')+'</div><div class="rb"><button class="b" data-r="p">Dinle</button>'+
      (o.extras||[]).map(function(x,i){return '<button class="b" data-r="x'+i+'">'+esc(x.label)+'</button>'}).join("")+
      '<button class="g" data-r="s">Tekrar Kaydet</button>'+(o.confirm?'<button class="gr" data-r="c">'+esc(o.confirm.label)+'</button>':'')+'</div>';
  }
  box.onclick=function(e){
    var b=e.target.closest("[data-r]");if(!b)return;var k=b.dataset.r;
    if(k==="s"){
      b.disabled=true;stopAll();
      cap=capture({max:max,alive:alive,onStart:recording,onTick:function(ms,l){tick(box,ms,l,max)},onDone:function(r,bf){raw=r;buf=bf;preview();if(o.onReady)o.onReady(r,bf);ev("pre")},onFail:function(){ready();ev("idle")}});
      cap.start();
    }else if(k==="e"){if(cap)cap.stop()}
    else if(k==="p"){play(buf)}
    else if(k==="c"){o.confirm.fn(raw,buf)}
    else if(k[0]==="x"){var x=o.extras[+k.slice(1)];play(x.rev?rev(buf):buf)}
  };
  ready();
}
function closeT(){stopAll();var o=$("ov");if(o)o.remove()}
async function loadDevs(){
  var s=$("dev");
  try{
    var st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(function(t){t.stop()});
    var ds=(await navigator.mediaDevices.enumerateDevices()).filter(function(d){return d.kind==="audioinput"});
    if(!$("dev"))return;
    s.innerHTML=ds.map(function(d){return '<option value="'+esc(d.deviceId)+'">'+esc(d.label||"Mikrofon")+'</option>'}).join("");
    if(micId&&ds.some(function(d){return d.deviceId===micId}))s.value=micId;else micId=s.value;
  }catch(e){if($("dev"))s.innerHTML='<option>Mikrofon izni gerekli</option>';msg("Mikrofon izni alınamadı. Tarayıcı ayarlarından izin ver.")}
}
function showTest(){
  closeT();var d=document.createElement("div");d.id="ov";d.className="ov";
  d.innerHTML='<div class="md" role="dialog" aria-modal="true" aria-label="Mikrofon kontrolü"><button class="x g" data-a="closeT" aria-label="Kapat">×</button><p class="eb">MİKROFON KONTROLÜ</p><h2>Sesini dene</h2><p class="sub">Oyuna başlamadan önce mikrofonunu seç, bir şey söyle ve tersten nasıl çıktığını dinle.</p><label for="dev">Mikrofon</label><select id="dev"></select><div id="tb"></div></div>';
  document.body.appendChild(d);
  $("dev").onchange=function(){micId=this.value;try{localStorage.setItem("netsretMic",micId)}catch(e){}};
  loadDevs();
  recUI($("tb"),{title:"Bir şey söyle",hint:"Örn: “Tarkan” ya da “Merhaba”",max:8,extras:[{label:"Tersten Dinle",rev:true}],note:"Mikrofon çalışıyor! Düz ve ters halini dinleyebilirsin."});
}

/* ---------- ağ ---------- */
function rc(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function nm(){var n=$("nm").value.trim();if(!n)msg("Önce takma adını yaz.");return n}
var INFO='<div class="card"><p class="eb">ÇOK OYUNCULU SESLİ PARTİ OYUNU</p><h2 class="hh">Tersten duyduğunu söyle, kelimeyi bul.</h2><p>netsret, en az 2 kişilik arkadaş gruplarıyla tarayıcıdan oynanan bir ses oyunudur. Anlatıcının gizli kelimesi tersine çevrilip herkese çalınır. Oyuncular duydukları garip sesi taklit eder; taklit yeniden tersine çevrilince kelime geri belirir. Hesap ya da kurulum gerekmez.</p></div>'+
'<div class="card"><h2>Nasıl oynanır?</h2>'+
[["Oda aç, arkadaşlarını çağır","Bir kişi oda açar ve 6 haneli kodu paylaşır. Diğerleri bu kodla katılır."],
["Anlatıcı kelimeyi kaydeder","Sırası gelen oyuncu gizli bir kelime ya da cümle yazar ve sesli söyleyerek kaydeder. Herkes, kurucunun lobide belirlediği sayıda sırayla anlatıcı olur."],
["Ters sesi taklit et","Diğer oyuncular kaydın tersten halini dinler. Duydukları garip sesi olduğu gibi taklit edip kaydeder."],
["Kendi sesini çöz","Taklit yeniden tersine çevrilir ve kayıt sahibine çalınır. Orijinale yaklaşan sesi dinleyip kelimeyi yazarak tahmin eder."],
["Sahne senin","Tur sonunda herkesin tersten duyduğu ses sırayla çalınır, tahminler açıklanır ve puanlar dağıtılır. Sonra sıradaki anlatıcıyla devam edilir."]].map(function(x,i){return '<div class="stp"><span class="n">'+(i+1)+'</span><p><b>'+x[0]+'</b>'+x[1]+'</p></div>'}).join("")+'</div>'+

'<div class="card"><h2>Başlamadan önce</h2><p>Mikrofonlu bir bilgisayar ve masaüstü tarayıcı (Chrome, Edge veya Firefox) yeterli. Kulaklık kullanırsan ses daha temiz kaydedilir. Başlamadan “Mikrofonu Dene” ile sesini kontrol et.</p></div>';

function host(){
  name=nm();if(!name)return;
  if(!window.Peer){msg("PeerJS yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.");return}
  if(peer)peer.destroy();
  code=rc();peer=new Peer("netsret-"+code);wd();
  peer.on("error",function(e){if(e.type==="unavailable-id")host();else msg("Bağlantı hatası: "+e.type)});
  peer.on("open",function(id){
    me=id;isHost=true;S={players:[{id:me,name:name,score:0}],order:[],idx:0,phase:"lobby",word:"",raw:null,got:{},st:{},cfg:{rounds:1,gt:60,cat:"Karışık"}};
    peer.on("connection",function(c){
      c.on("data",function(d){hmsg(c.peer,d,c)});
      c.on("close",function(){drop(c.peer)});
    });
    bc({t:"lobby"});
  });
}
function join(){
  name=nm();var c=$("code").value.trim().toUpperCase();
  if(!name||!c){if(name)msg("Oda kodunu yaz.");return}
  if(!window.Peer){msg("PeerJS yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.");return}
  if(peer)peer.destroy();
  code=c;peer=new Peer();wd();
  peer.on("error",function(e){msg(e.type==="peer-unavailable"?"Oda bulunamadı.":"Bağlantı hatası: "+e.type)});
  peer.on("open",function(id){
    me=id;hostConn=peer.connect("netsret-"+c,{reliable:true});
    hostConn.on("open",function(){hostConn.send({t:"hello",name:name})});
    hostConn.on("data",cmsg);
    hostConn.on("close",function(){msg("Kurucunun bağlantısı koptu. Sayfayı yenileyip yeni oda açın.")});
  });
}
function pub(){return{players:S.players,round:S.idx+1,total:S.order.length,narr:S.order[S.idx],st:S.st,ph:S.phase,cfg:S.cfg}}
function bc(m){m.p=pub();for(var k in conns)try{conns[k].send(m)}catch(e){}cmsg(m)}
function tohost(m){if(isHost)hmsg(me,m);else hostConn.send(m)}
function drop(id){
  delete conns[id];
  var i=S.players.findIndex(function(p){return p.id===id});if(i<0)return;
  S.players.splice(i,1);
  if(S.phase==="lobby"){bc({t:"lobby"});return}
  if(S.players.length<2){S.phase="end";bc({t:"end"});return}
  var wasNarr=S.order[S.idx]===id,before=0;
  S.order=S.order.filter(function(x,k){if(x===id){if(k<S.idx)before++;return false}return true});
  S.idx-=before;
  if(wasNarr&&S.phase==="reveal")S.idx--;
  if(wasNarr&&S.phase!=="reveal"){if(S.idx>=S.order.length){S.phase="end";bc({t:"end"})}else{S.phase="narr";S.got={};S.st={};bc({t:"narr"})}return}
  if(S.phase==="guess")chk();
}
function chk(){
  var n=S.order[S.idx];
  if(Object.keys(S.got).length>=S.players.filter(function(p){return p.id!==n}).length)finish();
}
function hmsg(from,d,c){
  if(d.t==="hello"){
    if(S.phase!=="lobby"){c.send({t:"err",m:"Oyun çoktan başladı."});return}
    conns[from]=c;S.players.push({id:from,name:String(d.name).slice(0,16),score:0});bc({t:"lobby"});
  }else if(d.t==="st"){
    if((S.phase==="narr"||S.phase==="guess")&&S.st[from]!=="sent"&&S.players.some(function(p){return p.id===from})){S.st[from]=String(d.s);bc({t:"stat"})}
  }else if(d.t==="orig"&&S.phase==="narr"&&from===S.order[S.idx]){
    S.word=d.word;S.raw=d.buf;S.phase="guess";S.got={};S.st={};
    clearTimeout(S.tm);
    if(S.cfg.gt){var ix=S.idx;S.tm=setTimeout(function(){if(S.phase==="guess"&&S.idx===ix)finish()},(S.cfg.gt+3)*1000)}
    bc({t:"guess",buf:d.buf});
  }else if(d.t==="guess"&&S.phase==="guess"&&from!==S.order[S.idx]&&!S.got[from]){
    S.got[from]={guess:String(d.guess),buf:d.buf};S.st[from]="sent";
    bc({t:"prog",n:Object.keys(S.got).length});chk();
  }
}
function finish(){clearTimeout(S.tm);
  var n=S.order[S.idx],res=[],c=0;
  S.players.forEach(function(p){
    if(p.id===n)return;var g=S.got[p.id];if(!g)return;
    var ok=norm(g.guess)===norm(S.word);if(ok){p.score++;c++}
    res.push({name:p.name,guess:g.guess,ok:ok,buf:g.buf});
  });
  var N=S.players.find(function(p){return p.id===n});if(N)N.score+=c;
  S.phase="reveal";S.st={};bc({t:"reveal",word:S.word,orig:S.raw,res:res});
}

function stText(P,p){
  var ph=P.ph,s=(P.st||{})[p.id],nr=p.id===P.narr;
  if(ph==="lobby")return p.id===P.players[0].id?"Kurucu":"Hazır";
  if(ph==="reveal")return "Gösterimi izliyor";
  if(ph==="end")return "Oyun bitti";
  if(ph==="narr")return nr?({rec:"Kelimeyi kaydediyor",pre:"Kaydı kontrol ediyor"}[s]||"Kelimesini hazırlıyor"):"Anlatıcıyı bekliyor";
  return nr?"Tahminleri bekliyor":({rec:"Taklidini kaydediyor",pre:"Tahmin yazıyor",sent:"Gönderdi ✓"}[s]||"Ters sesi dinliyor");

function panelInner(P){

}

function room(m){
  var tok=SR={again:false,done:false},steps=[],P=m.p,nn=nameOf(P,P.narr);
  steps.push({id:"wc",raw:m.orig,rv:false,p:"▸ DÜZ BANT",t:nn+" — Gerçek Kayıt",d:"Anlatıcının söylediği orijinal ses"});
  steps.push({id:"wc",raw:m.orig,rv:true,p:"◂ TERS BANT",t:nn+" — Tersten",d:"Oyuncuların duyduğu garip ses"});
  m.res.forEach(function(r,i){

  });
  Promise.all(steps.map(function(s){return load(s.raw)})).then(async function(bufs){
    for(var k=0;k<steps.length;k++){
      if(SR!==tok||!$("np"))return;
      var s=steps[k],b=s.rv?rev(bufs[k]):bufs[k],t0=performance.now();
      hl(s.id);setNp(s,b,k,steps.length);

        document.querySelectorAll("#np .wf i").forEach(function(e,i){e.classList.toggle("on",i<n)});
      },60);
      await new Promise(function(res){play(b,res)});

      if(tok.again){tok.again=false;k--;continue}
      if(s.rv&&s.i!==undefined)revealCard(m,s.i);

      })();

"Eşyalar":["Buzdolabı","Şemsiye","Çamaşır makinesi","Saç kurutma makinesi","Cep telefonu","Dikiş makinesi","Tost makinesi","Kol saati","Anahtarlık","Tornavida","Kulaklık","Ütü masası"],
"Meslekler":["Veteriner","İtfaiyeci","Berber","Pilot","Aşçı","Mimar","Gazeteci","Elektrikçi","Diş hekimi","Kuaför","Garson","Astronot"],
"Çizgi Film & Masal":["Pamuk Prenses","Kırmızı Başlıklı Kız","Külkedisi","Keloğlan","Temel Reis","Tom ve Jerry","Sünger Bob","Heidi","Pepee","Rafadan Tayfa","Alaaddin’in Sihirli Lambası","Hansel ve Gretel"],
"Günlük İfadeler":["Günaydın","Afiyet olsun","Geçmiş olsun","Hayırlı olsun","Kolay gelsin","Çok teşekkür ederim","Nasılsın","İyi akşamlar","Ellerine sağlık","Görüşürüz","Hoş geldin","Sağ ol"],
"Komik Cümleler":["Bana bir çay söyler misin","Karnım zil çalıyor","Telefonum şarjda kaldı","Yarın erkenden kalkacağım","Kedim koltuğu parçaladı","Ben aslında diyette değilim","Hocam ödevi evde unuttum","Pizzaya ananas koyma","Wifi şifresi nedir","Bir dakika bir dakika","Kapıyı çekip gelmedin değil mi","Çayım soğudu yine"]
};
var ALLW=[];for(var kk in POOL)ALLW=ALLW.concat(POOL[kk]);
var used={},tmi=null,sentG=false;
function sug(){
  var cat=(V.p&&V.p.cfg&&V.p.cfg.cat)||"Karışık",list=cat==="Karışık"?ALLW:(POOL[cat]||ALLW);
  var left=list.filter(function(x){return !used[x]});
  if(!left.length){used={};left=list}
  var w=left[Math.floor(Math.random()*left.length)];used[w]=1;
  var i=$("w");if(i){i.value=w;i.focus()}
}
function autoSend(){
  if(sentG||!V||V.t!=="guess"||V.p.narr===me)return;
  sentG=true;var raw=myRaw,g=$("g")?$("g").value.trim():"";
  sub('<div class="card"><h2>Süre doldu</h2><p>'+(raw?'Kaydın ve tahminin gönderildi.':'Taklit kaydın olmadığı için bu turda tahmin gönderilmedi.')+'</p></div>');
  if(raw)tohost({t:"guess",guess:g,buf:raw});
}
function startTmr(secs){
  clearInterval(tmi);if(!secs)return;
  var end=Date.now()+secs*1000;
  function tk(){
    var e=$("tmr"),l=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(e)e.textContent=l+" sn";
    if(l<=0){clearInterval(tmi);autoSend()}
  }
  tk();tmi=setInterval(tk,250);
}
var A={
  host:host,join:join,test:showTest,closeT:closeT,sug:sug,cat:function(b){if(isHost&&S.phase==="lobby"){S.cfg.cat=b.dataset.c;bc({t:"lobby"})}},
  tab:function(b){home(b.dataset.m)},
  start:function(){
    if(S.players.length<2){msg("En az 2 oyuncu gerekli.");return}
    var ids=S.players.map(function(p){return p.id}),n=(S.cfg&&S.cfg.rounds)||1;
    S.order=[];for(var r=0;r<n;r++)S.order=S.order.concat(ids);
    S.idx=0;S.got={};S.st={};S.phase="narr";bc({t:"narr"});
  },
  p1:function(){if(V.ob)play(rev(V.ob))},
  sd2:function(){
    var g=$("g").value;
    if(!myRaw){msg("Önce taklidini kaydet.");return}
    if(!norm(g)){msg("Tahmin yaz.");return}
    var raw=myRaw;sentG=true;
    sub('<div class="card"><h2>Gönderildi</h2><p>Diğer oyuncular bekleniyor…</p></div>');
    tohost({t:"guess",guess:g.trim(),buf:raw});
  },
  skip:function(){stopAll()},
  rep:function(){if(SR&&!SR.done){SR.again=true;stopAll()}},
  rpl:function(){stopAll();SR=null;var r=$("rg");if(r)r.innerHTML=cards(V);var c=$("cd");if(c)c.textContent="";room(V)},
  next:function(){
    if(S.phase!=="reveal")return;
    S.idx++;S.got={};S.st={};
    if(S.idx>=S.order.length){S.idx=S.order.length-1;S.phase="end";bc({t:"end"})}
    else{S.phase="narr";bc({t:"narr"})}
  },
  back:function(){S.players.forEach(function(p){p.score=0});S.order=[];S.idx=0;S.st={};S.phase="lobby";bc({t:"lobby"})}
};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  var f=A[b.dataset.a];if(f)f(b);
});
document.addEventListener("change",function(e){
  if(!isHost||S.phase!=="lobby")return;
  if(e.target.id==="cfg"){S.cfg.rounds=+e.target.value||1;bc({t:"lobby"})}
  else if(e.target.id==="gtsel"){S.cfg.gt=+e.target.value||0;bc({t:"lobby"})}
});
var lc=0,lt=0;
$("logo").addEventListener("click",function(){
  var n=Date.now();if(n-lt>4000)lc=0;lt=n;
  if(++lc>=10){lc=0;window.open("https://kick.com/pristagna","_blank","noopener")}
});
home("host");
showTest();
</script>
